<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <title>推しログ</title>
  <script src="components/loader.js"></script>
  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsenui.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsen-css-components.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/onsenui@2.12.9/js/onsenui.min.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
    <ons-page id="page_list">
      <ons-toolbar>
        <div class="center">推しログ</div>
      </ons-toolbar>

      <div class="app-section">
        <p class="app-caption">わたしの推し</p>
        <h1 class="app-heading">好きな理由を集めよう。</h1>
        <p class="app-description">学びや開発の中で見つけた、お気に入りの記録。</p>
      </div>

      <ons-list id="list_oshi">
        <ons-list-item class="oshi-card" tappable modifier="chevron">
          <div class="center">
            <span class="list-item__title oshi-name">NotebookLM</span>
            <span class="list-item__subtitle oshi-genre">学習ツール</span>
          </div>
        </ons-list-item>
        <ons-list-item class="oshi-card" tappable modifier="chevron">
          <div class="center">
            <span class="list-item__title oshi-name">Android Studio / Xcode</span>
            <span class="list-item__subtitle oshi-genre">開発ツール</span>
          </div>
        </ons-list-item>
        <ons-list-item class="oshi-card" tappable modifier="chevron">
          <div class="center">
            <span class="list-item__title oshi-name">AIエージェントを使ったアプリ開発</span>
            <span class="list-item__subtitle oshi-genre">気になる技術</span>
          </div>
        </ons-list-item>
      </ons-list>
      <p id="txt_selected" class="app-section app-selection" aria-live="polite">まだ選択していません</p>
    </ons-page>
</body>
</html>
