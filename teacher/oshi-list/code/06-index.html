<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <title>好きなものノート</title>
  <script src="components/loader.js"></script>
  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsenui.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsen-css-components.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/onsenui@2.12.9/js/onsenui.min.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <ons-page id="page_list">
    <ons-toolbar>
      <div class="center">好きなものノート</div>
    </ons-toolbar>
  <main class="app-section">
    <h1 class="app-heading">好きなものノート</h1>
    <article class="oshi-card">
      <p class="app-caption">音楽</p>
      <h2 class="oshi-name">好きな音楽</h2>
      <p>通学中に聴くと、元気になります。<br>好きな曲を何度も聴いています。</p>
    </article>
    <article class="oshi-card">
      <p class="app-caption">食べ物</p>
      <h2 class="oshi-name">カレー</h2>
      <p>自分の好きな辛さを選べるところが好きです。<br>お店ごとの味の違いも楽しめます。</p>
    </article>
    <article class="oshi-card">
      <p class="app-caption">場所</p>
      <h2 class="oshi-name">公園</h2>
      <p>ゆっくり歩いて、気分を変えられます。<br>季節によって景色が変わるところも好きです。</p>
    </article>
  </main>
  </ons-page>
</body>
</html>
