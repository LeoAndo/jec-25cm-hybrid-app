<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <title>好きなものノート</title>
  <script src="components/loader.js"></script>
  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsenui.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui@2.12.9/css/onsen-css-components.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/onsenui@2.12.9/js/onsenui.min.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <ons-navigator id="nav_app" page="list.html"></ons-navigator>

  <template id="list.html">
    <ons-page id="page_list">
      <ons-toolbar>
        <div class="center">好きなものノート</div>
      </ons-toolbar>

      <div class="app-section">
        <p class="app-caption">わたしの好きなもの</p>
        <h1 class="app-heading">好きな理由を集めよう。</h1>
        <p class="app-description">音楽、食べ物、場所。好きなものと理由の記録。</p>
      </div>

      <ons-list id="list_oshi"></ons-list>
      <p id="txt_selected" class="app-section app-selection" aria-live="polite">まだ選択していません</p>
    </ons-page>
  </template>

  <template id="detail.html">
    <ons-page id="page_detail">
      <ons-toolbar>
        <div class="left">
          <ons-back-button>戻る</ons-back-button>
        </div>
        <div class="center">詳細</div>
      </ons-toolbar>

      <div class="app-section">
        <p id="txt_detail_genre" class="app-caption"></p>
        <h1 id="txt_detail_name" class="app-heading"></h1>
        <p class="app-label">好きな理由</p>
        <p id="txt_detail_comment" class="app-comment"></p>
      </div>
    </ons-page>
  </template>
</body>
</html>
